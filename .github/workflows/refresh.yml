name: refresh

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/refresh.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/render_activity_report.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-report.svg
          git diff --cached --quiet || git commit -m "Refresh activity report"
          git push
